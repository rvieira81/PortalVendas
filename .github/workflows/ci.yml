# Integração contínua: compila, testa e verifica pacotes vulneráveis a cada push e pull request.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore PortalVendas.sln

      - name: Compilar
        run: dotnet build PortalVendas.sln -c Release --no-restore

      - name: Testar
        run: dotnet test PortalVendas.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Pacotes vulneráveis
        shell: pwsh
        run: |
          $saida = dotnet list PortalVendas.sln package --vulnerable --include-transitive
          $saida
          if ($saida -match 'has the following vulnerable packages') { throw 'Há pacotes com vulnerabilidades conhecidas.' }

      - name: Publicar artefato
        run: dotnet publish src/PortalVendas.Web/PortalVendas.Web.csproj -c Release -o publish --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: portalvendas-web
          path: publish
